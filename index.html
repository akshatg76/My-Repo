<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The 19th Trader | Premium Trading Community</title>
  <meta
    name="description"
    content="The 19th Trader is a premium trading and investing community focused on market education, stock insights, portfolio guidance, investment habits, and disciplined financial growth."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #071018;
      --bg-2: #0d1a29;
      --bg-3: #111d2e;
      --panel: rgba(15, 24, 35, 0.92);
      --panel-2: rgba(19, 29, 41, 0.95);
      --card: rgba(18, 27, 39, 0.92);
      --card-2: rgba(24, 35, 50, 0.92);
      --text: #edf6ff;
      --muted: #aab9ca;
      --line: rgba(255, 255, 255, 0.08);
      --gold: #f4c86a;
      --gold-2: #e7b14a;
      --green: #38d39f;
      --red: #ff6a6a;
      --blue: #76a9ff;
      --purple: #a88dff;
      --shadow: 0 26px 70px rgba(0,0,0,0.38);
      --radius: 24px;
    }

    body.light {
      --bg: #f5f7fb;
      --bg-2: #edf2fa;
      --bg-3: #e8edf7;
      --panel: rgba(255,255,255,0.92);
      --panel-2: rgba(246,248,252,0.96);
      --card: rgba(255,255,255,0.95);
      --card-2: rgba(244,247,252,0.98);
      --text: #121b2b;
      --muted: #616f86;
      --line: rgba(16, 24, 39, 0.08);
      --shadow: 0 18px 45px rgba(28, 40, 62, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(244, 200, 106, 0.12), transparent 26%),
        radial-gradient(circle at bottom right, rgba(118, 169, 255, 0.10), transparent 22%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      line-height: 1.6;
      transition: all 0.25s ease;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input {
      font: inherit;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    .premium {
      font-family: "Playfair Display", serif;
      letter-spacing: -0.05em;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 16, 24, 0.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    body.light header {
      background: rgba(245,247,251,0.72);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold), #f9e7b8);
      color: #17120a;
      font-weight: 900;
      box-shadow: 0 12px 20px rgba(244, 200, 106, 0.25);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #f7df9b);
      color: #17120a;
      box-shadow: 0 12px 26px rgba(244, 200, 106, 0.22);
    }

    .btn-secondary {
      border-color: var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--text);
    }

    .hero {
      padding: 90px 0 54px;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 42px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid rgba(244,200,106,0.24);
      background: rgba(244,200,106,0.08);
      color: var(--gold);
      border-radius: 999px;
      letter-spacing: 0.12em;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hero h1 {
      margin-top: 20px;
      font-size: clamp(3.1rem, 6vw, 6rem);
      line-height: 0.96;
      letter-spacing: -0.07em;
    }

    .hero h1 .accent {
      color: var(--gold);
    }

    .lead {
      max-width: 620px;
      margin-top: 18px;
      font-size: 1.06rem;
      color: var(--muted);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .hero-trust {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 28px;
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .hero-trust span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero-trust span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px rgba(56,211,159,0.7);
    }

    .market-panel {
      position: relative;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18,29,40,0.98), rgba(12,19,27,0.98));
      box-shadow: var(--shadow);
      padding: 26px 22px;
      overflow: hidden;
    }

    body.light .market-panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(243,247,252,0.96));
    }

    .panel-glow {
      position: absolute;
      width: 240px;
      height: 240px;
      right: -80px;
      top: -90px;
      border-radius: 50%;
      background: rgba(244,200,106,0.14);
      filter: blur(50px);
      pointer-events: none;
    }

    .market-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px rgba(56,211,159,0.7);
    }

    .index-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .index-box {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
    }

    .index-box small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .index-box strong {
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      letter-spacing: -0.04em;
    }

    .green { color: var(--green); }
    .red { color: var(--red); }

    .chart {
      height: 180px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        rgba(255,255,255,0.02);
      background-size: 26px 26px;
      position: relative;
    }

    .chart svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .chart polyline {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3;
      filter: drop-shadow(0 0 10px rgba(244,200,106,0.35));
    }

    .mini-watchlist {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .watch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
    }

    .watch-name {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .watch-meta {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .ticker-strip {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      overflow: hidden;
      margin-top: 8px;
    }

    .ticker-inner {
      display: flex;
      gap: 42px;
      width: max-content;
      padding: 14px 0;
      animation: scrollTicker 28s linear infinite;
      white-space: nowrap;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @keyframes scrollTicker {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .section {
      padding: 72px 0;
    }

    .section-header {
      max-width: 760px;
      margin-bottom: 26px;
    }

    .section-header h2 {
      margin-top: 12px;
      font-size: clamp(2.1rem, 4vw, 3.6rem);
      line-height: 1.04;
      letter-spacing: -0.06em;
    }

    .section-header p {
      margin-top: 12px;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 18px;
    }

    .stat-box {
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .stat-box strong {
      display: block;
      color: var(--gold);
      font-size: clamp(1.8rem, 2.8vw, 2.4rem);
      letter-spacing: -0.06em;
    }

    .stat-box span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    .service-card {
      position: relative;
      padding: 24px 22px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .service-card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -52px;
      bottom: -70px;
      background: rgba(244,200,106,0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .service-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(244,200,106,0.1);
      color: var(--gold);
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .service-card h3 {
      font-size: 1.28rem;
      margin-bottom: 10px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .insight-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 22px;
      align-items: flex-start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }

    .panel-body {
      padding: 12px 18px 18px;
    }

    .news-item {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 14px;
      padding: 15px 10px;
      border-bottom: 1px solid var(--line);
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-thumb {
      width: 90px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(244,200,106,0.18), rgba(118,169,255,0.18));
      color: var(--gold);
      font-weight: 800;
      font-size: 0.78rem;
    }

    .news-meta {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .news-item h4 {
      margin-bottom: 8px;
      font-size: 1rem;
      line-height: 1.4;
    }

    .news-item p {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .habit-item, .trivia-item {
      padding: 18px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
    }

    .habit-item strong, .trivia-item strong {
      display: block;
      margin-bottom: 8px;
      font-size: 0.96rem;
    }

    .habit-item p, .trivia-item p {
      color: var(--muted);
      font-size: 0.87rem;
    }

    .quiz-box {
      padding: 26px 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .quiz-box h3 {
      margin-bottom: 14px;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
    }

    .quiz-options {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .quiz-option:hover {
      border-color: rgba(244,200,106,0.6);
      transform: translateX(2px);
    }

    #quizResult {
      display: none;
      margin-top: 18px;
      padding: 16px 18px;
      border-left: 3px solid var(--gold);
      border-radius: 12px;
      background: rgba(244,200,106,0.08);
      color: var(--text);
      font-weight: 500;
    }

    .community-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    .community-card {
      padding: 22px 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .community-icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(244,200,106,0.10);
      color: var(--gold);
      font-size: 1.4rem;
      margin-bottom: 16px;
    }

    .community-card h3 {
      font-size: 1.28rem;
      margin-bottom: 10px;
    }

    .community-card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .testimonials {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }

    .testimonial {
      padding: 22px 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .stars {
      color: var(--gold);
      font-size: 1rem;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }

    .testimonial p {
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.7;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .person-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #f5de9b);
      color: #141414;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .person strong {
      display: block;
      font-size: 0.9rem;
    }

    .person small {
      color: var(--muted);
    }

    .faq {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }

    .faq-item {
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }

    .faq-item h4 {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .faq-item p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .newsletter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding: 28px 24px;
      border: 1px solid rgba(244,200,106,0.24);
      border-radius: 26px;
      background: linear-gradient(130deg, rgba(244,200,106,0.11), rgba(118,169,255,0.06));
      box-shadow: var(--shadow);
    }

    .newsletter h3 {
      font-size: clamp(1.7rem, 3vw, 2.7rem);
      letter-spacing: -0.05em;
    }

    .newsletter p {
      color: var(--muted);
      margin-top: 8px;
    }

    .newsletter-form {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .newsletter-form input {
      min-width: min(360px, 100%);
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      padding: 0 18px;
      outline: none;
    }

    .cta-box {
      margin-top: 30px;
      padding: 32px 26px;
      border-radius: 28px;
      border: 1px solid rgba(244,200,106,0.25);
      background:
        linear-gradient(135deg, rgba(244,200,106,0.12), rgba(118,169,255,0.08)),
        var(--panel);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .cta-box h3 {
      font-size: clamp(1.8rem, 3vw, 3rem);
      letter-spacing: -0.05em;
    }

    .cta-box p {
      color: var(--muted);
      margin-top: 8px;
    }

    .cta-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer {
      padding: 38px 0 56px;
      border-top: 1px solid var(--line);
      margin-top: 42px;
    }

    .footer-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .disclaimer {
      max-width: 900px;
      margin: 18px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.8;
    }

    @media (max-width: 980px) {
      .hero-grid,
      .insight-layout {
        grid-template-columns: 1fr;
      }

      .stats-grid, .services, .community-cards, .testimonials {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 720px) {
      .nav-links {
        display: none;
      }

      .stats-grid, .services, .community-cards, .testimonials {
        grid-template-columns: 1fr;
      }

      .newsletter-form {
        width: 100%;
      }

      .newsletter-form input {
        width: 100%;
      }

      .cta-box {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="#" class="brand">
        <span class="brand-mark">19</span>
        <span class="premium">The 19th Trader</span>
      </a>

      <nav>
